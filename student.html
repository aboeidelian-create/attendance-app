<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ملف الطالب</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="layout">
  <div class="sidebar" id="sidebar"></div>
  <div class="main">
    <div class="topbar">
      <button class="hamburger" id="hamburger">☰</button>
      <h1>ملف الطالب</h1>
      <a class="btn secondary" href="students.html">رجوع للطلاب</a>
    </div>

    <div class="card" id="infoCard"></div>

    <div class="card">
      <h3>سجل الحضور</h3>
      <div class="grid" style="margin-bottom:14px">
        <div class="stat-card"><div class="num" id="totalPresent">0</div><div class="label">إجمالي الحضور</div></div>
        <div class="stat-card"><div class="num" id="totalAbsent">0</div><div class="label">إجمالي الغياب</div></div>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>التاريخ</th><th>الحالة</th></tr></thead>
          <tbody id="attendanceBody"></tbody>
        </table>
      </div>
      <div class="empty" id="emptyAtt" style="display:none">لا توجد سجلات حضور بعد</div>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/utils.js"></script>
<script src="js/guard.js"></script>
<script src="js/student.js"></script>
</body>
</html>
