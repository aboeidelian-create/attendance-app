<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>نظام إدارة المرحلة الإعدادية</title>
</head>
<body>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabaseClient.js"></script>
<script>
(async () => {
  const { data: { session } } = await db.auth.getSession();
  if (!session) { location.href = 'login.html'; return; }
  const { data: profile } = await db.from('profiles').select('role').eq('id', session.user.id).single();
  if (profile && profile.role === 'manager') location.href = 'dashboard-manager.html';
  else if (profile && profile.role === 'staff') location.href = 'dashboard-staff.html';
  else location.href = 'login.html';
})();
</script>
</body>
</html>
